# Hermes injects only the FIRST skill a webhook route lists, so each route gets one bundle
# (creat0r-wake-<route>) that install.sh builds from hermes/skills/*.
# Merged into ~/.hermes/profiles/creat0r/config.yaml by install.sh (merge_config.py).
# "__CREAT0R_DIR__" is replaced with the absolute creat0r path at install time.
model:
  provider: anthropic
  default: claude-opus-5-5
  # Hermes' blank config ships an OpenRouter base_url; point it at Anthropic.
  base_url: https://api.anthropic.com

agent:
  reasoning_effort: medium

# Own gateway for this profile only (never served by, and never touching, the default host gateway).
gateway:
  standalone: true

terminal:
  backend: local
  cwd: "__CREAT0R_DIR__"

# Profile creat0r only: nobody is around to answer a terminal approval prompt.
approvals:
  mode: "off"

# Admin chat (API server) gets the same small surface as the webhooks, plus memory.
platform_toolsets:
  api_server: [terminal, memory]

platforms:
  webhook:
    extra:
      host: 127.0.0.1
      routes:
        campaign-start:
          prompt: "Campaign {campaign_id} moved to phase '{phase}'. Run the creat0r-find skill for it now."
          skills: [creat0r-wake-campaign-start]   # bundle built by install.sh
          toolsets: [terminal]
          deliver: log
        creator-message:
          prompt: "New creator message on deal {deal_id} (message {message_id}). Read the deal context and handle it."
          coalesce:
            key: deal_id
            window_seconds: 20
            max_wait_seconds: 90
          skills: [creat0r-wake-creator-message]
          toolsets: [terminal]
          deliver: log
        admin-decision:
          prompt: "The admin side changed something. Payload: {__raw__}. Use creat0r-admin to act on it."
          skills: [creat0r-wake-admin-decision]
          toolsets: [terminal]
          deliver: log
